<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="Generate and edit technical diagrams with an AI-assisted Excalidraw workspace."
        />
        <meta name="theme-color" content="#f7f7f8" />
        <title>Excali — Technical diagram workspace</title>
        <script>
            (function () {
                var stored = localStorage.getItem("excali-theme");
                var theme =
                    stored === "light" || stored === "dark"
                        ? stored
                        : window.matchMedia("(prefers-color-scheme: dark)")
                                .matches
                          ? "dark"
                          : "light";
                document.documentElement.dataset.theme = theme;
            })();
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/client/main.tsx"></script>
    </body>
</html>
